name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*']
        include:
          - laravel: '10.*'
            testbench: '^8.0'
            # لاراول ۱۰ و ۱۱ دیگر پچ امنیتی نمی‌گیرند و Composer 2.9 به‌طور
            # پیش‌فرض نصبشان را بلاک می‌کند. چون این پایه‌ها فقط برای بررسی
            # «سازگاری» تست می‌شوند، بلاک را فقط برای همین‌ها خاموش می‌کنیم.
            allow_advisories: '1'
          - laravel: '11.*'
            testbench: '^9.0'
            allow_advisories: '1'
          - laravel: '12.*'
            testbench: '^10.0'
            allow_advisories: '0'
        exclude:
          # لاراول ۱۰ با PHP 8.4 رسماً پشتیبانی نمی‌شود
          - php: '8.4'
            laravel: '10.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, openssl
          coverage: none

      - name: Install dependencies
        run: |
          FLAGS=""
          if [ "${{ matrix.allow_advisories }}" = "1" ]; then
            FLAGS="--no-security-blocking"
          fi

          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress $FLAGS

      - name: Run tests
        run: vendor/bin/phpunit --colors=never
